<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff6b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SPI İş Takip Sistemi</title>
  <link rel="icon" type="image/x-icon" href="spistakip.ico">
  <link rel="apple-touch-icon" href="spistakip.ico">
  <link rel="manifest" href="#" id="manifest-placeholder">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --primary:#ff6b35;--primary-dark:#e55a2b;--primary-light:rgba(255,107,53,.15);
      --secondary:#004e89;--success:#06d6a0;--warning:#ffd23f;
      --danger:#ef476f;--info:#118ab2;
      --dark:#111111;--gray:#1e1e1e;--card:#242424;--light-gray:#333333;
      --text:#f0f0f0;--text-muted:#888888;--border:rgba(255,255,255,.07);
      --shadow:0 8px 32px rgba(0,0,0,.4);
    }

    html{scroll-behavior:smooth}
    body{font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse at 20% 20%,rgba(255,107,53,.05) 0%,transparent 60%),
                       radial-gradient(ellipse at 80% 80%,rgba(0,78,137,.05) 0%,transparent 60%)}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:var(--dark)}
    ::-webkit-scrollbar-thumb{background:var(--light-gray);border-radius:3px}

    .container{max-width:1440px;margin:0 auto;padding:20px}

    /* ── Buttons ── */
    .btn{padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
      transition:all .2s ease;font-family:'Outfit',sans-serif;display:inline-flex;align-items:center;
      gap:7px;justify-content:center;white-space:nowrap}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
      box-shadow:0 4px 14px rgba(255,107,53,.3)}
    .btn-primary:hover{box-shadow:0 6px 20px rgba(255,107,53,.45);transform:translateY(-1px)}
    .btn-success{background:linear-gradient(135deg,#06d6a0,#04a87c);color:#fff;box-shadow:0 4px 14px rgba(6,214,160,.25)}
    .btn-success:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(6,214,160,.35)}
    .btn-danger{background:linear-gradient(135deg,#ef476f,#c73057);color:#fff;box-shadow:0 4px 14px rgba(239,71,111,.25)}
    .btn-danger:hover{transform:translateY(-1px)}
    .btn-warning{background:linear-gradient(135deg,var(--warning),#e6b800);color:#111}
    .btn-info{background:linear-gradient(135deg,#118ab2,#0d6e8e);color:#fff}
    .btn-ghost{background:transparent;border:1.5px solid var(--light-gray);color:var(--text)}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
    .btn-secondary{background:rgba(0,78,137,.2);border:1px solid rgba(0,78,137,.5);color:#a8d4f5}
    .btn-secondary:hover{background:rgba(0,78,137,.35)}
    .btn-icon{padding:8px 10px;border-radius:8px;font-size:16px}
    .btn-sm{padding:7px 14px;font-size:13px}
    .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}

    /* ── Forms ── */
    .form-group{margin-bottom:16px}
    .form-label{display:block;margin-bottom:7px;font-weight:600;font-size:12px;color:var(--text-muted);
      text-transform:uppercase;letter-spacing:.6px}
    .form-input,.form-textarea,.form-select{width:100%;padding:12px 16px;background:var(--light-gray);
      border:1.5px solid transparent;border-radius:10px;color:var(--text);font-size:14px;
      font-family:'Outfit',sans-serif;transition:all .2s ease}
    .form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--primary);
      background:var(--card);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
    .form-select option{background:var(--gray)}
    .form-textarea{resize:vertical;min-height:100px;font-family:'JetBrains Mono',monospace;font-size:13px}
    .form-input::placeholder,.form-textarea::placeholder{color:var(--text-muted)}
    .input-with-icon{position:relative}
    .input-with-icon .form-input{padding-left:42px}
    .input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}

    /* ── Header ── */
    .header{background:rgba(20,20,20,.9);backdrop-filter:blur(20px);padding:16px 24px;
      border-radius:16px;margin-bottom:24px;border:1px solid var(--border);
      display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
      position:sticky;top:12px;z-index:100;box-shadow:var(--shadow)}
    .logo-container{display:flex;align-items:center;gap:12px}
    .logo-img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(255,107,53,.4))}
    .logo-text{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--warning));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
    .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

    /* ── Notification Bell ── */
    .notif-btn{position:relative;background:var(--card);border:1px solid var(--border);
      padding:9px 12px;border-radius:10px;cursor:pointer;font-size:18px;transition:all .2s ease;
      color:var(--text)}
    .notif-btn:hover{border-color:var(--primary);background:var(--light-gray)}
    .notif-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;
      font-size:10px;font-weight:700;padding:2px 5px;border-radius:8px;min-width:17px;
      text-align:center;font-family:'JetBrains Mono',monospace}
    .notif-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;padding-right:4px}
    .notif-item{background:var(--light-gray);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
    .notif-item-title{font-weight:700;font-size:14px}
    .notif-item-body{font-size:13px;color:var(--text-muted);margin-top:4px}
    .notif-item-meta{font-size:11px;color:var(--text-muted);margin-top:6px}

    /* ── User badge ── */
    .user-badge{background:var(--card);padding:8px 14px;border-radius:10px;font-size:14px;
      display:flex;align-items:center;gap:8px;border:1px solid var(--border)}
    .role-badge{padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
    .role-admin{background:rgba(255,107,53,.2);color:var(--primary);border:1px solid rgba(255,107,53,.3)}
    .role-teknisyen{background:rgba(6,214,160,.2);color:var(--success);border:1px solid rgba(6,214,160,.3)}

    /* ── Stats Grid ── */
    .dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
    .stat-card{background:var(--card);padding:22px 20px;border-radius:14px;border:1px solid var(--border);
      transition:all .25s ease;cursor:pointer;position:relative;overflow:hidden}
    .stat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--c1,.1) 0%,transparent 100%);opacity:0;transition:opacity .3s}
    .stat-card:hover::before{opacity:1}
    .stat-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.3);border-color:rgba(255,107,53,.2)}
    .stat-value{font-size:38px;font-weight:800;margin-bottom:6px;font-family:'JetBrains Mono',monospace}
    .stat-label{color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
    .stat-sub{color:var(--text-muted);font-size:11px;margin-top:4px}
    .stat-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:36px;opacity:.12}

    /* ── Tabs ── */
    .tabs-wrapper{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:12px;
      border:1px solid var(--border);width:fit-content;margin-bottom:22px;flex-wrap:wrap}
    .tab-btn{padding:9px 20px;border:none;border-radius:9px;font-size:14px;font-weight:600;
      cursor:pointer;transition:all .2s ease;color:var(--text-muted);background:transparent;
      font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:7px;white-space:nowrap}
    .tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(255,107,53,.3)}
    .tab-btn:not(.active):hover{color:var(--text);background:var(--light-gray)}

    /* ── Toolbar (search + filters) ── */
    .toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
    .search-box{flex:1;min-width:200px;position:relative}
    .search-box .form-input{padding-left:40px;background:var(--card)}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-muted)}
    .filter-group{display:flex;gap:8px;flex-wrap:wrap}
    .filter-chip{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
      border:1.5px solid var(--light-gray);background:transparent;color:var(--text-muted);
      transition:all .2s ease;font-family:'Outfit',sans-serif}
    .filter-chip:hover,.filter-chip.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
    .sort-select{padding:8px 12px;border-radius:8px;background:var(--card);border:1.5px solid var(--light-gray);
      color:var(--text);font-size:13px;font-family:'Outfit',sans-serif;cursor:pointer}
    .sort-select:focus{outline:none;border-color:var(--primary)}

    /* ── Jobs Grid ── */
    .jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}

    /* ── Job Card ── */
    .job-card{background:var(--card);border-radius:16px;border:1px solid var(--border);
      transition:all .25s ease;position:relative;overflow:hidden;display:flex;flex-direction:column}
    .job-card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.35);border-color:rgba(255,107,53,.2)}
    .job-card-accent{position:absolute;top:0;left:0;right:0;height:3px}
    .accent-bekliyor{background:linear-gradient(90deg,var(--warning),#ffaa00)}
    .accent-devam{background:linear-gradient(90deg,var(--success),#04a87c)}
    .accent-tamamlandi{background:linear-gradient(90deg,#555,#777)}
    .accent-yuksek{background:linear-gradient(90deg,var(--danger),#c73057)!important}
    .job-card-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:0}
    .job-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
    .job-title{font-size:17px;font-weight:700;line-height:1.3;margin-bottom:3px}
    .job-id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)}
    .job-status{padding:5px 11px;border-radius:16px;font-size:11px;font-weight:700;text-transform:uppercase;
      white-space:nowrap;letter-spacing:.5px;flex-shrink:0}
    .status-bekliyor{background:rgba(255,210,63,.15);color:var(--warning);border:1px solid rgba(255,210,63,.25)}
    .status-devam{background:rgba(6,214,160,.15);color:var(--success);border:1px solid rgba(6,214,160,.25)}
    .status-tamamlandi{background:rgba(136,136,136,.15);color:#888;border:1px solid rgba(136,136,136,.2)}
    .job-meta{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
    .job-detail{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-muted)}
    .job-detail-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
    .job-desc{background:rgba(255,255,255,.04);padding:10px 12px;border-radius:8px;
      font-size:13px;color:var(--text-muted);border-left:3px solid var(--light-gray);
      margin-bottom:14px;line-height:1.5}
    .priority-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:16px;
      font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .priority-Yüksek{background:rgba(239,71,111,.15);color:#ef476f;border:1px solid rgba(239,71,111,.25)}
    .priority-Normal{background:rgba(255,210,63,.15);color:#ffd23f;border:1px solid rgba(255,210,63,.2)}
    .priority-Düşük{background:rgba(6,214,160,.15);color:#06d6a0;border:1px solid rgba(6,214,160,.2)}
    .job-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px 16px;border-top:1px solid var(--border);
      background:rgba(255,255,255,.02)}
    .job-actions .btn{flex:1;min-width:100px}

    /* ── Timer ── */
    .timer-block{background:rgba(0,0,0,.3);border-radius:10px;padding:13px 16px;
      border:1px solid var(--light-gray);margin:12px 0}
    .timer-value{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;
      color:var(--success);text-align:center;letter-spacing:2px}
    .timer-value.warn{color:var(--warning)}
    .timer-label{font-size:11px;color:var(--text-muted);text-align:center;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
    .timer-alert{background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.25);
      color:var(--warning);padding:8px 12px;border-radius:8px;font-size:12px;margin-top:8px;text-align:center}
    .reminder-box{background:rgba(255,210,63,.06);border:1px solid rgba(255,210,63,.2);
      border-radius:10px;padding:12px 14px;margin-top:10px}
    .reminder-box p{font-size:13px;color:var(--warning);margin-bottom:10px;font-weight:600}
    .reminder-actions{display:flex;gap:8px}
    .reminder-actions .btn{flex:1;font-size:12px;padding:7px 10px}

    /* ── Modal ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
      display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
    .modal{background:var(--gray);border-radius:20px;width:100%;max-width:680px;max-height:90vh;
      overflow-y:auto;border:1px solid rgba(255,107,53,.15);box-shadow:0 24px 64px rgba(0,0,0,.6)}
    .modal-sm{max-width:460px}
    .modal-header{padding:24px 28px 18px;border-bottom:1px solid var(--border);
      display:flex;justify-content:space-between;align-items:flex-start}
    .modal-title{font-size:20px;font-weight:700}
    .modal-subtitle{font-size:13px;color:var(--text-muted);margin-top:3px}
    .modal-close{background:var(--light-gray);border:none;color:var(--text-muted);font-size:18px;
      cursor:pointer;border-radius:8px;padding:6px 9px;transition:all .2s;line-height:1}
    .modal-close:hover{background:var(--danger);color:#fff}
    .modal-body{padding:24px 28px}
    .modal-footer{padding:16px 28px 24px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

    /* ── Charts ── */
    .chart-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:24px;margin-bottom:20px}
    .chart-title{font-size:17px;font-weight:700;margin-bottom:6px}
    .chart-sub{font-size:13px;color:var(--text-muted);margin-bottom:18px}
    .chart-canvas{width:100%;height:280px}

    /* ── Period Selector ── */
    .period-selector{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
    .period-btn{padding:7px 14px;border:1.5px solid var(--light-gray);background:transparent;color:var(--text-muted);
      border-radius:8px;cursor:pointer;transition:all .2s ease;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif}
    .period-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .period-btn:hover:not(.active){border-color:var(--primary);color:var(--primary)}

    /* ── Login ── */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{background:var(--gray);border-radius:24px;padding:48px 44px;max-width:440px;width:100%;
      border:1px solid rgba(255,107,53,.15);box-shadow:0 24px 64px rgba(0,0,0,.5)}
    .login-logo{width:72px;height:72px;margin:0 auto 16px;filter:drop-shadow(0 4px 16px rgba(255,107,53,.5))}
    .login-title{font-size:32px;font-weight:800;text-align:center;margin-bottom:6px;
      background:linear-gradient(135deg,var(--primary),var(--warning));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .login-sub{text-align:center;color:var(--text-muted);font-size:15px;margin-bottom:32px}
    .pin-input{text-align:center;font-size:28px;letter-spacing:12px;font-family:'JetBrains Mono',monospace;
      padding:18px!important;font-weight:700}

    /* ── Empty State ── */
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
    .empty-icon{font-size:56px;margin-bottom:16px;opacity:.25}
    .empty-title{font-size:17px;font-weight:600;margin-bottom:6px;color:var(--text-muted)}
    .empty-sub{font-size:14px;color:var(--text-muted);opacity:.7}

    /* ── Toast ── */
    .toast-container{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
    .toast{background:var(--gray);padding:14px 18px;border-radius:12px;border-left:4px solid var(--primary);
      box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:280px;max-width:380px;pointer-events:all;
      animation:toastIn .3s ease}
    .toast.removing{animation:toastOut .3s ease forwards}
    .toast-success{border-left-color:var(--success)}
    .toast-warning{border-left-color:var(--warning)}
    .toast-error{border-left-color:var(--danger)}
    .toast-info{border-left-color:var(--info)}
    .toast-title{font-weight:700;font-size:14px;margin-bottom:3px}
    .toast-message{font-size:13px;color:var(--text-muted);line-height:1.4}

    /* ── Progress Bar ── */
    .progress-bar{width:100%;height:6px;background:var(--light-gray);border-radius:3px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--warning));transition:width .4s ease}

    /* ── Alerts ── */
    .alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:14px;font-weight:500}
    .alert-danger{background:rgba(239,71,111,.1);border:1px solid rgba(239,71,111,.25);color:#ffb3c1}
    .alert-success{background:rgba(6,214,160,.1);border:1px solid rgba(6,214,160,.25);color:#b7ffe9}
    .alert-warning{background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.25);color:#fff3b0}
    .alert-info{background:rgba(17,138,178,.1);border:1px solid rgba(17,138,178,.25);color:#ade8f4}

    /* ── Table ── */
    .data-table{width:100%;border-collapse:collapse;font-size:14px}
    .data-table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;
      letter-spacing:.7px;color:var(--text-muted);border-bottom:1px solid var(--border)}
    .data-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
    .data-table tr:last-child td{border-bottom:none}
    .data-table tr:hover td{background:rgba(255,255,255,.02)}

    /* ── User Cards (in modal) ── */
    .user-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
      background:var(--light-gray);border-radius:10px;margin-bottom:8px;gap:10px}
    .user-item:last-child{margin-bottom:0}
    .user-name{font-weight:700;font-size:15px;margin-bottom:2px}
    .user-meta{font-size:12px;color:var(--text-muted)}
    .user-actions-group{display:flex;gap:6px;flex-shrink:0}

    /* ── Section Header ── */
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
    .section-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
    .count-badge{background:var(--light-gray);color:var(--text-muted);padding:3px 9px;border-radius:8px;font-size:13px;font-weight:700}

    /* ── Divider ── */
    .divider{height:1px;background:var(--border);margin:20px 0}

    /* ── Worklog item ── */
    .worklog-item{padding:14px 16px;background:var(--light-gray);border-radius:10px;margin-bottom:8px}
    .worklog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .worklog-title{font-weight:700;font-size:14px}
    .worklog-duration{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--success);
      background:rgba(6,214,160,.1);padding:3px 10px;border-radius:6px}
    .worklog-meta{font-size:12px;color:var(--text-muted)}
    .worklog-notes{font-size:13px;color:var(--text-muted);margin-top:6px;padding:8px 10px;
      background:rgba(255,255,255,.03);border-radius:6px;border-left:3px solid var(--light-gray)}

    /* ── Grid helpers ── */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

    /* ── Animations ── */
    .fade-in{animation:fadeIn .4s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100%)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .pulse-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);
      animation:pulse 1.5s ease-in-out infinite}

    /* ── Responsive ── */
    @media(max-width:768px){
      .container{padding:12px}
      .header{padding:12px 16px;top:8px}
      .logo-text{font-size:18px}
      .grid2,.grid3{grid-template-columns:1fr}
      .jobs-grid{grid-template-columns:1fr}
      .dashboard-grid{grid-template-columns:repeat(2,1fr)}
      .header-right .btn span{display:none}
      .modal{border-radius:16px}
      .login-card{padding:32px 24px}
    }
    @media(max-width:480px){
      .dashboard-grid{grid-template-columns:1fr 1fr}
      .toolbar{flex-direction:column}
      .search-box{width:100%}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast-container" class="toast-container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    // ─── Firebase Config ───────────────────────────────
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyCugtMDUMD9D6lxbpQ52_fOUV3WIoLrllo",
      authDomain: "sp-b-b272d.firebaseapp.com",
      projectId: "sp-b-b272d",
      messagingSenderId: "519404683421",
      appId: "1:519404683421:web:6e8a403c372e9fcd9d5474"
    };

    const { useEffect, useMemo, useRef, useState, useCallback } = React;

    // ─── PWA Manifest ──────────────────────────────────
    const manifest = {
      name:"SPI İş Takip Sistemi",short_name:"SPI Takip",
      description:"Teknisyen iş takip ve yönetim sistemi",
      start_url:"./",display:"standalone",background_color:"#111111",theme_color:"#ff6b35",
      icons:[{src:"spistakip.ico",sizes:"48x48",type:"image/x-icon"}]
    };
    document.getElementById('manifest-placeholder').href =
      URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));

    // ─── Helpers ───────────────────────────────────────
    const nowIso = () => new Date().toISOString();
    const safeTrim = v => (v ?? '').toString().trim();
    const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
    const fmtDateShort = iso => iso ? new Date(iso).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
    const toHoursMin = secs => {
      const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };
    const randomId = () => Math.random().toString(36).substr(2,8).toUpperCase();

    // ─── Toast ─────────────────────────────────────────
    const showToast = (title, message, type='info') => {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.innerHTML = `<div class="toast-title">${title}</div><div class="toast-message">${message}</div>`;
      c.appendChild(t);
      setTimeout(() => {
        t.classList.add('removing');
        setTimeout(() => t.remove(), 300);
      }, 4500);
    };

    // ─── Browser Notifications ─────────────────────────
    const registerServiceWorker = async () => {
      if (!('serviceWorker' in navigator)) return false;
      try {
        await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        return true;
      } catch (e) {
        console.warn('Service worker kaydı başarısız:', e);
        return false;
      }
    };

    const requestNotifPermission = async () => {
      if ('Notification' in window && Notification.permission === 'default') {
        const p = await Notification.requestPermission();
        if (p === 'granted') showToast('Bildirimler Aktif', 'Artık bildirim alacaksınız!','success');
      }
    };
    const sendNotif = (title, body) => {
      if ('Notification' in window && Notification.permission === 'granted')
        new Notification(title, { body, icon: 'spistakip.ico' });
    };

    const publishNotification = async (db, payload) => {
      try {
        await db.collection('notifications').add({
          title: payload.title || 'SPI Bildirim',
          body: payload.body || '',
          createdAt: nowIso(),
          targetRole: payload.targetRole || 'all',
          targetUserId: payload.targetUserId || null,
          createdBy: payload.createdBy || null
        });
      } catch (e) {
        console.warn('Bildirim kaydı yazılamadı:', e);
      }
    };

    // ─── Timer Component ───────────────────────────────
    const Timer = ({ startTime, isPaused, onReminder }) => {
      const [elapsed, setElapsed] = useState(0);
      const [reminderDone, setReminderDone] = useState(false);

      useEffect(() => {
        if (isPaused) return;
        const iv = setInterval(() => {
          const s = Math.floor((Date.now() - new Date(startTime).getTime()) / 1000);
          setElapsed(s);
          if (s >= 3600 && !reminderDone) {
            setReminderDone(true);
            onReminder?.();
            sendNotif('⏰ 1 Saat Geçti!', 'İşinize devam ediyor musunuz?');
            showToast('⏰ Hatırlatma', '1 saattir bu iş devam ediyor.', 'warning');
          }
        }, 1000);
        return () => clearInterval(iv);
      }, [startTime, isPaused, reminderDone]);

      const isOver = elapsed >= 3600;
      return (
        <div className="timer-block">
          <div className={`timer-value${isOver?' warn':''}`}>{toHoursMin(elapsed)}</div>
          <div className="timer-label">{isPaused ? '⏸ Duraklatıldı' : '▶ Çalışma Süresi'}</div>
          {isOver && !isPaused && <div className="timer-alert">⚠️ 1 saatten uzun süredir devam ediyor</div>}
        </div>
      );
    };

    // ─── WorkHoursChart ────────────────────────────────
    const WorkHoursChart = ({ data, type = 'bar' }) => {
      const ref = useRef(null);
      const chartRef = useRef(null);
      useEffect(() => {
        if (!ref.current || !data) return;
        if (chartRef.current) chartRef.current.destroy();
        const ctx = ref.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type,
          data: {
            labels: data.labels,
            datasets: [{
              label: 'Çalışma Saati',
              data: data.values,
              backgroundColor: type === 'doughnut'
                ? ['rgba(255,107,53,.8)','rgba(6,214,160,.8)','rgba(255,210,63,.8)','rgba(17,138,178,.8)','rgba(239,71,111,.8)']
                : 'rgba(255,107,53,.65)',
              borderColor: type === 'doughnut' ? 'transparent' : 'rgba(255,107,53,1)',
              borderWidth: type === 'doughnut' ? 0 : 2,
              borderRadius: type === 'bar' ? 8 : 0,
              hoverOffset: 6
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: type === 'doughnut', position: 'right',
                labels: { color: '#888', padding: 14, font: { family: 'Outfit', size: 13 } }
              },
              tooltip: {
                backgroundColor: 'rgba(17,17,17,.95)', titleColor:'#fff', bodyColor:'#888',
                borderColor:'rgba(255,107,53,.4)', borderWidth:1, padding:12, displayColors: false,
                callbacks: { label: ctx => `${ctx.parsed.y?.toFixed(1) ?? ctx.parsed.toFixed(1)} saat` }
              }
            },
            scales: type === 'doughnut' ? {} : {
              y: { beginAtZero:true, grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'#666',callback:v=>v+'h'} },
              x: { grid:{display:false}, ticks:{color:'#666'} }
            }
          }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [data, type]);
      return <canvas ref={ref} className="chart-canvas" />;
    };

    // ─── Statistics View ───────────────────────────────
    const StatisticsView = ({ user, db }) => {
      const [period, setPeriod] = useState('week');
      const [chartData, setChartData] = useState(null);
      const [techData, setTechData] = useState(null);
      const [stats, setStats] = useState({ totalHours:0, completedJobs:0, avgDuration:0, efficiency:0 });
      const [worklogs, setWorklogs] = useState([]);

      useEffect(() => { loadStats(); }, [period]);

      const loadStats = async () => {
        try {
          const now = new Date();
          let startDate;
          if (period==='today') startDate = new Date(now.getFullYear(),now.getMonth(),now.getDate());
          else if (period==='week') startDate = new Date(now.getTime()-7*864e5);
          else startDate = new Date(now.getFullYear(),now.getMonth(),1);

          const q = user.role==='admin'
            ? db.collection('worklogs').where('createdAt','>=',startDate.toISOString())
            : db.collection('worklogs').where('userId','==',user.id).where('createdAt','>=',startDate.toISOString());

          const snap = await q.get();
          const logs = snap.docs.map(d=>({id:d.id,...d.data()}));
          setWorklogs(logs);

          const totalH = logs.reduce((s,l)=>s+(l.duration||0),0);
          const cnt = logs.length;
          setStats({
            totalHours: totalH.toFixed(1), completedJobs: cnt,
            avgDuration: cnt>0?(totalH/cnt).toFixed(1):'0',
            efficiency: Math.min(100,Math.round((cnt/Math.max(1,now.getDate()))*100))
          });

          // Bar chart
          const labels=[], values=[];
          if (period==='today') {
            for(let i=0;i<24;i++){
              labels.push(i+':00');
              values.push(logs.filter(l=>new Date(l.createdAt).getHours()===i).reduce((s,l)=>s+(l.duration||0),0));
            }
          } else if (period==='week') {
            const days=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
            for(let i=0;i<7;i++){
              const d=new Date(now.getTime()-(6-i)*864e5);
              labels.push(days[d.getDay()]||days[i]);
              values.push(logs.filter(l=>new Date(l.createdAt).toDateString()===d.toDateString()).reduce((s,l)=>s+(l.duration||0),0));
            }
          } else {
            const weeks=Math.ceil(now.getDate()/7);
            for(let i=0;i<weeks;i++){
              labels.push(`${i+1}. Hafta`);
              const ws=new Date(now.getFullYear(),now.getMonth(),i*7+1);
              const we=new Date(now.getFullYear(),now.getMonth(),(i+1)*7+1);
              values.push(logs.filter(l=>{const d=new Date(l.createdAt);return d>=ws&&d<we;}).reduce((s,l)=>s+(l.duration||0),0));
            }
          }
          setChartData({labels,values});

          // Tech doughnut (admin only)
          if (user.role==='admin') {
            const usersSnap = await db.collection('users').where('role','==','teknisyen').get();
            const users = usersSnap.docs.map(d=>({id:d.id,...d.data()}));
            const tLabels=[], tValues=[];
            users.forEach(u=>{
              tLabels.push(u.name);
              tValues.push(logs.filter(l=>l.userId===u.id).reduce((s,l)=>s+(l.duration||0),0));
            });
            setTechData({labels:tLabels,values:tValues});
          }
        } catch(e) {
          console.error(e);
          showToast('Hata','İstatistikler yüklenemedi','error');
        }
      };

      return (
        <div className="fade-in">
          <div className="period-selector">
            {[['today','Bugün'],['week','Bu Hafta'],['month','Bu Ay']].map(([v,l])=>(
              <button key={v} className={`period-btn${period===v?' active':''}`} onClick={()=>setPeriod(v)}>{l}</button>
            ))}
          </div>

          <div className="dashboard-grid" style={{marginBottom:22}}>
            {[
              {v:stats.totalHours,l:'Toplam Saat',icon:'⏱️',c:'var(--primary)'},
              {v:stats.completedJobs,l:'Tamamlanan',icon:'✅',c:'var(--success)'},
              {v:stats.avgDuration,l:'Ort. Süre (h)',icon:'📊',c:'var(--warning)'},
              {v:stats.efficiency+'%',l:'Verimlilik',icon:'🎯',c:'var(--info)'}
            ].map(({v,l,icon,c})=>(
              <div className="stat-card" key={l}>
                <div className="stat-value" style={{color:c,fontSize:'32px'}}>{v}</div>
                <div className="stat-label">{l}</div>
                <div className="stat-icon">{icon}</div>
              </div>
            ))}
          </div>

          <div className={techData ? 'grid2' : ''} style={techData?{gap:18,marginBottom:20}:{}}>
            <div className="chart-card">
              <div className="chart-title">Çalışma Saatleri</div>
              <div className="chart-sub">{period==='today'?'Saatlik dağılım':period==='week'?'Günlük dağılım':'Haftalık dağılım'}</div>
              {chartData && <WorkHoursChart data={chartData} type="bar" />}
            </div>
            {techData && (
              <div className="chart-card">
                <div className="chart-title">Teknisyen Dağılımı</div>
                <div className="chart-sub">Toplam saat / teknisyen</div>
                <WorkHoursChart data={techData} type="doughnut" />
              </div>
            )}
          </div>

          {worklogs.length > 0 && (
            <div className="chart-card">
              <div className="chart-title">Son İş Kayıtları</div>
              <div className="chart-sub">{worklogs.length} kayıt</div>
              <div style={{maxHeight:280,overflowY:'auto'}}>
                {[...worklogs].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,10).map(log=>(
                  <div key={log.id} className="worklog-item">
                    <div className="worklog-head">
                      <div className="worklog-title">{log.jobId?.slice(0,12)}…</div>
                      <div className="worklog-duration">{log.duration}h</div>
                    </div>
                    <div className="worklog-meta">{fmtDateShort(log.createdAt)}</div>
                    {log.notes && <div className="worklog-notes">{log.notes}</div>}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── Login ─────────────────────────────────────────
    const Login = ({ db, onLogin }) => {
      const [pin, setPin] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async e => {
        e.preventDefault();
        const p = safeTrim(pin);
        if (!p) { setError('PIN gerekli!'); return; }
        setLoading(true);
        try {
          const snap = await db.collection('users').where('pin','==',p).get();
          if (snap.empty) { setError('Geçersiz PIN!'); setTimeout(()=>setError(''),2500); setLoading(false); return; }
          const data = snap.docs[0].data();
          await requestNotifPermission();
          onLogin({ id: snap.docs[0].id, ...data });
          showToast('Hoş Geldiniz!', `${data.name} olarak giriş yaptınız`, 'success');
        } catch(err) {
          setError('Giriş hatası: '+(err.message||err));
          setLoading(false);
        }
      };

      return (
        <div className="login-wrap">
          <div className="login-card fade-in">
            <img src="spistakip.ico" alt="SPI Logo" className="login-logo" style={{display:'block'}} />
            <div className="login-title">SPI İş Takip</div>
            <div className="login-sub">PIN kodunuzu girin</div>
            {error && <div className="alert alert-danger">{error}</div>}
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <input type="password" className="form-input pin-input" value={pin}
                  onChange={e=>setPin(e.target.value)} placeholder="••••" maxLength="6" autoFocus disabled={loading} />
              </div>
              <button type="submit" className="btn btn-primary" style={{width:'100%'}} disabled={loading}>
                {loading ? '⏳ Giriş yapılıyor…' : '🔑 Giriş Yap'}
              </button>
            </form>
          </div>
        </div>
      );
    };

    // ─── Complete Job Modal ─────────────────────────────
    const CompleteJobModal = ({ job, db, actorUser, onClose, onComplete }) => {
      const [duration, setDuration] = useState('');
      const [notes, setNotes] = useState('');
      const [saving, setSaving] = useState(false);

      const handle = async () => {
        if (!duration || isNaN(duration) || +duration <= 0) {
          showToast('Eksik', 'Geçerli bir süre girin!', 'warning'); return;
        }
        setSaving(true);
        try {
          await db.collection('worklogs').add({
            jobId: job.id, userId: job.assignedTo,
            startTime: job.startTime, endTime: nowIso(),
            duration: parseFloat(duration), notes: safeTrim(notes), createdAt: nowIso()
          });
          await db.collection('jobs').doc(job.id).update({ status:'tamamlandi', completedAt: nowIso() });
          showToast('Tamamlandı!', job.title, 'success');
          sendNotif('✅ İş Tamamlandı', job.title);
          await publishNotification(db, {
            title: '✅ İş Tamamlandı',
            body: `${job.title} işi tamamlandı.`,
            targetRole: 'admin',
            createdBy: actorUser?.id || null
          });
          onComplete?.(); onClose();
        } catch(e) { showToast('Hata', e.message||e, 'error'); } finally { setSaving(false); }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal modal-sm fade-in" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">✅ İşi Tamamla</div>
                <div className="modal-subtitle">{job.title}</div>
              </div>
              <button className="modal-close" onClick={onClose}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-group">
                <label className="form-label">Harcanan Süre (Saat) *</label>
                <input type="number" step="0.25" min="0.25" className="form-input" value={duration}
                  onChange={e=>setDuration(e.target.value)} placeholder="Örn: 2.5" disabled={saving} />
              </div>
              <div className="form-group">
                <label className="form-label">Açıklama / Notlar</label>
                <textarea className="form-textarea" value={notes}
                  onChange={e=>setNotes(e.target.value)} placeholder="Yapılan işlem detayları…" disabled={saving} />
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={onClose} disabled={saving}>İptal</button>
              <button className="btn btn-success" onClick={handle} disabled={saving}>
                {saving ? '⏳ Kaydediliyor…' : '✓ Tamamla'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ─── Edit Job Modal (Admin) ─────────────────────────
    const EditJobModal = ({ job, db, technicians, onClose }) => {
      const [title, setTitle] = useState(job.title||'');
      const [description, setDescription] = useState(job.description||'');
      const [location, setLocation] = useState(job.location||'');
      const [type, setType] = useState(job.type||'');
      const [assignedTo, setAssignedTo] = useState(job.assignedTo||'');
      const [priority, setPriority] = useState(job.priority||'Normal');
      const [estimatedTime, setEstimatedTime] = useState(job.estimatedTime||'');
      const [saving, setSaving] = useState(false);

      const handle = async e => {
        e.preventDefault();
        if (!safeTrim(title)||!assignedTo) { showToast('Eksik','Başlık ve Teknisyen gerekli!','warning'); return; }
        setSaving(true);
        try {
          await db.collection('jobs').doc(job.id).update({
            title:safeTrim(title), description:safeTrim(description),
            location:safeTrim(location), type:safeTrim(type),
            assignedTo, priority, estimatedTime:safeTrim(estimatedTime),
            updatedAt: nowIso()
          });
          showToast('Güncellendi!', title, 'success'); onClose();
        } catch(e) { showToast('Hata',e.message||e,'error'); } finally { setSaving(false); }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal fade-in" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div><div className="modal-title">✏️ İşi Düzenle</div></div>
              <button className="modal-close" onClick={onClose}>✕</button>
            </div>
            <form onSubmit={handle}>
              <div className="modal-body">
                <div className="grid2">
                  <div className="form-group">
                    <label className="form-label">İş Başlığı *</label>
                    <input className="form-input" value={title} onChange={e=>setTitle(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Teknisyen *</label>
                    <select className="form-select" value={assignedTo} onChange={e=>setAssignedTo(e.target.value)}>
                      <option value="">Seçin</option>
                      {technicians.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Açıklama</label>
                  <textarea className="form-textarea" value={description} onChange={e=>setDescription(e.target.value)} />
                </div>
                <div className="grid2">
                  <div className="form-group">
                    <label className="form-label">Lokasyon</label>
                    <input className="form-input" value={location} onChange={e=>setLocation(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">İş Tipi</label>
                    <input className="form-input" value={type} onChange={e=>setType(e.target.value)} />
                  </div>
                </div>
                <div className="grid2">
                  <div className="form-group">
                    <label className="form-label">Öncelik</label>
                    <select className="form-select" value={priority} onChange={e=>setPriority(e.target.value)}>
                      <option value="Düşük">Düşük</option>
                      <option value="Normal">Normal</option>
                      <option value="Yüksek">Yüksek</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Tahmini Süre</label>
                    <input className="form-input" value={estimatedTime} onChange={e=>setEstimatedTime(e.target.value)} placeholder="Örn: 2 saat" />
                  </div>
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" className="btn btn-ghost" onClick={onClose}>İptal</button>
                <button type="submit" className="btn btn-primary" disabled={saving}>{saving?'⏳ Kaydediliyor…':'💾 Kaydet'}</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // ─── Create Job Modal (Admin) ───────────────────────
    const CreateJobModal = ({ db, technicians, adminUser, onClose }) => {
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [location, setLocation] = useState('');
      const [type, setType] = useState('');
      const [assignedTo, setAssignedTo] = useState('');
      const [priority, setPriority] = useState('Normal');
      const [estimatedTime, setEstimatedTime] = useState('');
      const [saving, setSaving] = useState(false);

      const handle = async e => {
        e.preventDefault();
        if (!safeTrim(title)||!assignedTo) { showToast('Eksik','Başlık ve Teknisyen gerekli!','warning'); return; }
        setSaving(true);
        try {
          await db.collection('jobs').add({
            title:safeTrim(title), description:safeTrim(description),
            location:safeTrim(location), type:safeTrim(type),
            assignedTo, status:'bekliyor', priority,
            estimatedTime:safeTrim(estimatedTime),
            createdBy:adminUser.id, createdAt:nowIso()
          });
          await publishNotification(db, {
            title: '🆕 Yeni İş Atandı',
            body: `${safeTrim(title)} işi size atandı.`,
            targetUserId: assignedTo,
            createdBy: adminUser.id
          });
          showToast('İş Oluşturuldu!', title, 'success'); onClose();
        } catch(e) { showToast('Hata',e.message||e,'error'); } finally { setSaving(false); }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal fade-in" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div><div className="modal-title">➕ Yeni İş Ekle</div></div>
              <button className="modal-close" onClick={onClose}>✕</button>

                  <div className="form-group">
                    <label className="form-label">İş Başlığı *</label>
                    <input className="form-input" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Örn: Hat 3 Elektrik Arızası" autoFocus />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Teknisyen *</label>
                    <select className="form-select" value={assignedTo} onChange={e=>setAssignedTo(e.target.value)}>
                      <option value="">Seçin</option>
                      {technicians.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Açıklama</label>
                  <textarea className="form-textarea" value={description} onChange={e=>setDescription(e.target.value)} placeholder="Detaylı açıklama…" />
                </div>
                <div className="grid2">
                  <div className="form-group">
                    <label className="form-label">Lokasyon</label>
                    <input className="form-input" value={location} onChange={e=>setLocation(e.target.value)} placeholder="Örn: Hat 3 - Makine A12" />
                  </div>
                  <div className="form-group">
                    <label className="form-label">İş Tipi</label>
                    <input className="form-input" value={type} onChange={e=>setType(e.target.value)} placeholder="Örn: Elektrik" />
                  </div>
                </div>
                <div className="grid2">
                  <div className="form-group">
                    <label className="form-label">Öncelik</label>
                    <select className="form-select" value={priority} onChange={e=>setPriority(e.target.value)}>
                      <option value="Düşük">Düşük</option>
                      <option value="Normal">Normal</option>
                      <option value="Yüksek">Yüksek</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Tahmini Süre</label>
                    <input className="form-input" value={estimatedTime} onChange={e=>setEstimatedTime(e.target.value)} placeholder="Örn: 2 saat" />

                <button type="button" className="btn btn-ghost" onClick={onClose}>İptal</button>

              </div>
            </form>

    // ─── Job Detail Modal ──────────────────────────────

        db.collection('worklogs').where('jobId','==',job.id).get().then(snap=>{

    // ─── Job Card ───────────────────────────────────────
    const JobCard = ({ job, user, db, onUpdate, technicians = [] }) => {
      const [showComplete, setShowComplete] = useState(false);
      const [showEdit, setShowEdit] = useState(false);
      const [showDetail, setShowDetail] = useState(false);
      const [showReminder, setShowReminder] = useState(false);

      const handleStart = async () => {
        await db.collection('jobs').doc(job.id).update({ status:'devam', startTime:nowIso(), isPaused:false });
        showToast('Başlatıldı', job.title, 'success');
        sendNotif('▶️ İş Başlatıldı', job.title);
        await publishNotification(db, {
          title: '▶️ İş Başlatıldı',
          body: `${job.title} işi başlatıldı.`,
          targetRole: 'admin',
          createdBy: user?.id || null
        });
      };

      const handlePause = async () => {
        await db.collection('jobs').doc(job.id).update({ isPaused:!job.isPaused });
        showToast(job.isPaused?'Devam Ediyor':'Duraklatıldı', job.title, 'info');
      };

      const statusLabels = { bekliyor:'Bekliyor', devam:'Devam Ediyor', tamamlandi:'Tamamlandı' };
      const isAdmin = user.role === 'admin';
      const techName = technicians.find(t=>t.id===job.assignedTo)?.name;
      const accentClass = job.priority==='Yüksek' ? 'accent-yuksek' : `accent-${job.status}`;

      return (
        <>
          <div className="job-card fade-in">
            <div className={`job-card-accent ${accentClass}`}></div>
            <div className="job-card-body">
              <div className="job-header">
                <div style={{flex:1}}>
                  <div className="job-title">{job.title}</div>
                  <div style={{display:'flex',gap:6,alignItems:'center',marginTop:5,flexWrap:'wrap'}}>
                    <span className="job-id">{job.id?.slice(0,10)}</span>
                    <span className={`priority-pill priority-${job.priority}`}>{job.priority}</span>
                    {job.status==='devam' && <span className="pulse-dot"></span>}
                  </div>
                </div>
                <span className={`job-status status-${job.status}`}>{statusLabels[job.status]}</span>
              </div>

              <div className="job-meta">
                {job.location && <div className="job-detail"><span className="job-detail-icon">📍</span>{job.location}</div>}
                {job.type && <div className="job-detail"><span className="job-detail-icon">🔧</span>{job.type}</div>}
                {job.estimatedTime && <div className="job-detail"><span className="job-detail-icon">⏱️</span>Tahmini: {job.estimatedTime}</div>}
                {isAdmin && techName && <div className="job-detail"><span className="job-detail-icon">👤</span>{techName}</div>}
                {job.createdAt && <div className="job-detail"><span className="job-detail-icon">📅</span>{fmtDateShort(job.createdAt)}</div>}
              </div>

              {job.description && <div className="job-desc">{job.description.length > 120 ? job.description.slice(0,120)+'…' : job.description}</div>}

              {job.status==='devam' && job.startTime && (
                <Timer startTime={job.startTime} isPaused={job.isPaused} onReminder={()=>setShowReminder(true)} />
              )}

              {showReminder && (
                <div className="reminder-box">
                  <p>⚠️ 1 saattir devam ediyor. Hâlâ çalışıyor musunuz?</p>
                  <div className="reminder-actions">
                    <button className="btn btn-success btn-sm" onClick={()=>setShowReminder(false)}>✓ Evet</button>
                    <button className="btn btn-danger btn-sm" onClick={()=>{setShowReminder(false);setShowComplete(true);}}>İşi Tamamla</button>
                  </div>
                </div>
              )}

              {job.status==='tamamlandi' && job.completedAt && (
                <div style={{padding:'8px 12px',background:'rgba(6,214,160,.07)',borderRadius:8,fontSize:13,color:'var(--success)',border:'1px solid rgba(6,214,160,.15)',marginTop:6}}>
                  ✅ {fmtDateShort(job.completedAt)} tamamlandı
                </div>
              )}
            </div>

            <div className="job-actions">
              <button className="btn btn-ghost btn-sm" onClick={()=>setShowDetail(true)}>🔍 Detay</button>
              {job.status==='bekliyor' && <button className="btn btn-success btn-sm" onClick={handleStart}>▶ Başlat</button>}
              {job.status==='devam' && (
                <>
                  <button className="btn btn-secondary btn-sm" onClick={handlePause}>{job.isPaused?'▶ Devam':'⏸ Duraklat'}</button>
                  <button className="btn btn-primary btn-sm" onClick={()=>setShowComplete(true)}>✓ Tamamla</button>
                </>
              )}
              {isAdmin && job.status!=='tamamlandi' && (
                <button className="btn btn-ghost btn-sm btn-icon" title="Düzenle" onClick={()=>setShowEdit(true)}>✏️</button>
              )}
            </div>
          </div>

          {showComplete && <CompleteJobModal job={job} db={db} actorUser={user} onClose={()=>setShowComplete(false)} onComplete={onUpdate} />}
          {showEdit && <EditJobModal job={job} db={db} technicians={technicians} onClose={()=>setShowEdit(false)} />}
          {showDetail && <JobDetailModal job={job} db={db} technicians={technicians} onClose={()=>setShowDetail(false)} />}
        </>
      );

    const NotificationsModal = ({ notifications, onClose, onRequestPermission }) => (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal modal-sm fade-in" onClick={e=>e.stopPropagation()}>
          <div className="modal-header">
            <div>
              <div className="modal-title">🔔 Bildirim Merkezi</div>
              <div className="modal-subtitle">Web / iOS / Android için ortak bildirim akışı</div>
            </div>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <div className="modal-body">
            <button className="btn btn-secondary btn-sm" onClick={onRequestPermission} style={{marginBottom:12}}>
              📳 Tarayıcı Bildirim İzni
            </button>
            {notifications.length===0 ? (
              <div className="empty-state" style={{padding:'30px 6px'}}>
                <div className="empty-icon">🔕</div>
                <div className="empty-title">Henüz bildirim yok</div>
              </div>
            ) : (
              <div className="notif-list">
                {notifications.map(n=>(
                  <div className="notif-item" key={n.id}>
                    <div className="notif-item-title">{n.title}</div>
                    <div className="notif-item-body">{n.body}</div>
                    <div className="notif-item-meta">{fmtDateShort(n.createdAt)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    );

    // ─── Dashboard ──────────────────────────────────────
    const Dashboard = ({ user, db, onLogout }) => {
      const [jobs, setJobs] = useState([]);
      const [technicians, setTechnicians] = useState([]);
      const [activeTab, setActiveTab] = useState('jobs');
      const [jobsSubTab, setJobsSubTab] = useState('active');
      const [search, setSearch] = useState('');
      const [filterPriority, setFilterPriority] = useState('');
      const [sortBy, setSortBy] = useState('newest');
      const [showCreate, setShowCreate] = useState(false);
      const [showUsers, setShowUsers] = useState(false);
      const [showNotifications, setShowNotifications] = useState(false);
      const [notifications, setNotifications] = useState([]);
      const [unreadCount, setUnreadCount] = useState(0);

      const canReadNotification = useCallback((n) => {
        if (!n) return false;
        if (n.targetUserId && n.targetUserId === user.id) return true;
        if (n.targetRole === 'all') return true;
        return n.targetRole === user.role;
      }, [user]);

      useEffect(() => {
        if (user.role!=='admin') return;
        const unsub = db.collection('users').where('role','==','teknisyen').onSnapshot(snap=>{
          setTechnicians(snap.docs.map(d=>({id:d.id,...d.data()})));
        });
        return ()=>unsub();
      }, [user, db]);

      useEffect(() => {
        let unsub;
        if (user.role==='admin') {
          unsub = db.collection('jobs').onSnapshot(snap=>{ setJobs(snap.docs.map(d=>({id:d.id,...d.data()}))); });
        } else {
          unsub = db.collection('jobs').where('assignedTo','==',user.id).onSnapshot(snap=>{
            setJobs(snap.docs.map(d=>({id:d.id,...d.data()})));
          });
        }
        return ()=>unsub&&unsub();
      }, [user, db]);

      useEffect(() => {
        const unsub = db.collection('notifications').orderBy('createdAt','desc').limit(60).onSnapshot(snap => {
          const all = snap.docs.map(d=>({id:d.id,...d.data()})).filter(canReadNotification);
          setNotifications(all);
          const seenKey = `seenNotifAt_${user.id}`;
          const seenAt = localStorage.getItem(seenKey);
          const unread = all.filter(n => !seenAt || new Date(n.createdAt) > new Date(seenAt)).length;
          setUnreadCount(unread);
        });
        return ()=>unsub();
      }, [db, user, canReadNotification]);

      const markNotificationsSeen = () => {
        localStorage.setItem(`seenNotifAt_${user.id}`, nowIso());
        setUnreadCount(0);
      };

      const isAdmin = user.role === 'admin';

      // Counts
      const totalActive = jobs.filter(j=>j.status!=='tamamlandi').length;
      const waiting = jobs.filter(j=>j.status==='bekliyor').length;
      const inProgress = jobs.filter(j=>j.status==='devam').length;
      const completed = jobs.filter(j=>j.status==='tamamlandi').length;
      const highPriority = jobs.filter(j=>j.priority==='Yüksek'&&j.status!=='tamamlandi').length;

      // Filtered & sorted
      const displayJobs = useMemo(() => {
        let list = jobs.filter(j => jobsSubTab==='active' ? j.status!=='tamamlandi' : j.status==='tamamlandi');
        if (search) {
          const q = search.toLowerCase();
          list = list.filter(j =>
            j.title?.toLowerCase().includes(q) ||
            j.location?.toLowerCase().includes(q) ||
            j.type?.toLowerCase().includes(q) ||
            j.description?.toLowerCase().includes(q)
          );
        }
        if (filterPriority) list = list.filter(j=>j.priority===filterPriority);
        list.sort((a,b) => {
          if (sortBy==='newest') return new Date(b.createdAt)-new Date(a.createdAt);
          if (sortBy==='oldest') return new Date(a.createdAt)-new Date(b.createdAt);
          if (sortBy==='priority') {
            const order = {Yüksek:0,Normal:1,Düşük:2};
            return (order[a.priority]??1)-(order[b.priority]??1);
          }
          if (sortBy==='az') return (a.title||'').localeCompare(b.title||'','tr');
          return 0;
        });
        return list;
      }, [jobs, jobsSubTab, search, filterPriority, sortBy]);

      return (
        <div className="container">
          {/* Header */}
          <div className="header fade-in">
            <div className="logo-container">
              <img src="spistakip.ico" alt="SPI Logo" className="logo-img" />
              <div className="logo-text">SPI İş Takip {isAdmin && <span style={{fontSize:14,fontWeight:400,opacity:.7}}>(Admin)</span>}</div>
            </div>
            <div className="header-right">
              <button className="notif-btn" title="Bildirimler" onClick={()=>{setShowNotifications(true);markNotificationsSeen();}}>
                🔔
                {unreadCount > 0 && <span className="notif-badge">{unreadCount}</span>}
              </button>
              <div className="user-badge">
                <span>👤</span>
                <span style={{fontWeight:600}}>{user.name}</span>
                <span className={`role-badge role-${user.role}`}>{user.role}</span>
              </div>
              {isAdmin && (
                <>
                  <button className="btn btn-primary" onClick={()=>setShowCreate(true)}>
                    <span>➕</span><span>İş Ekle</span>
                  </button>
                  <button className="btn btn-ghost" onClick={()=>setShowUsers(true)}>
                    <span>👥</span><span>Kullanıcılar</span>
                  </button>
                </>
              )}
              <button className="btn btn-ghost btn-icon" title="Çıkış" onClick={onLogout}>🚪</button>
            </div>
          </div>

          {/* Stats */}
          <div className="dashboard-grid fade-in">
            {[
              {v:totalActive, l:'Aktif İşler', sub:`${inProgress} devam ediyor`, icon:'📋', c:'var(--primary)'},
              {v:waiting, l:'Bekliyor', sub:'Henüz başlanmadı', icon:'⏳', c:'var(--warning)'},
              {v:inProgress, l:'Devam Eden', sub:'Şu an aktif', icon:'⚡', c:'var(--success)'},
              {v:completed, l:'Tamamlanan', sub:'Kapatılan işler', icon:'✅', c:'#666'},
              ...(isAdmin ? [{v:highPriority, l:'Yüksek Öncelik', sub:'Acil işler', icon:'🚨', c:'var(--danger)'}] : [])
            ].map(({v,l,sub,icon,c})=>(
              <div className="stat-card" key={l} onClick={()=>setActiveTab('jobs')}>
                <div className="stat-value" style={{color:c}}>{v}</div>
                <div className="stat-label">{l}</div>
                <div className="stat-sub">{sub}</div>
                <div className="stat-icon">{icon}</div>
              </div>
            ))}
          </div>

          {/* Main Tabs */}
          <div className="tabs-wrapper">
            <button className={`tab-btn${activeTab==='jobs'?' active':''}`} onClick={()=>setActiveTab('jobs')}>
              📋 İşler
            </button>
            <button className={`tab-btn${activeTab==='stats'?' active':''}`} onClick={()=>setActiveTab('stats')}>
              📊 İstatistikler
            </button>
          </div>

          {activeTab==='jobs' && (
            <>
              {/* Sub Tabs */}
              <div className="tabs-wrapper">
                <button className={`tab-btn${jobsSubTab==='active'?' active':''}`} onClick={()=>setJobsSubTab('active')}>
                  🔥 Aktif ({totalActive})
                </button>
                <button className={`tab-btn${jobsSubTab==='completed'?' active':''}`} onClick={()=>setJobsSubTab('completed')}>
                  ✅ Tamamlanan ({completed})
                </button>
              </div>

              {/* Toolbar */}
              <div className="toolbar">
                <div className="search-box">
                  <span className="search-icon">🔍</span>
                  <input className="form-input" placeholder="İş ara (başlık, lokasyon, tip…)" value={search} onChange={e=>setSearch(e.target.value)} />
                </div>
                <div className="filter-group">
                  {['','Yüksek','Normal','Düşük'].map(p=>(
                    <button key={p||'all'} className={`filter-chip${filterPriority===p?' active':''}`} onClick={()=>setFilterPriority(p)}>
                      {p||'Tümü'}
                    </button>
                  ))}
                </div>
                <select className="sort-select" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
                  <option value="newest">En Yeni</option>
                  <option value="oldest">En Eski</option>
                  <option value="priority">Öncelik</option>
                  <option value="az">A-Z</option>
                </select>
              </div>

              {displayJobs.length===0 ? (
                <div className="empty-state">
                  <div className="empty-icon">📭</div>
                  <div className="empty-title">{search || filterPriority ? 'Arama sonucu bulunamadı' : jobsSubTab==='active' ? 'Aktif iş bulunmuyor' : 'Tamamlanmış iş yok'}</div>
                  <div className="empty-sub">{search ? `"${search}" için sonuç yok` : isAdmin && jobsSubTab==='active' ? '"İş Ekle" ile yeni iş oluşturun' : ''}</div>
                </div>
              ) : (
                <div className="jobs-grid">
                  {displayJobs.map(job=>(
                    <JobCard key={job.id} job={job} user={user} db={db} onUpdate={()=>{}} technicians={technicians} />
                  ))}
                </div>
              )}
            </>
          )}

          {activeTab==='stats' && <StatisticsView user={user} db={db} />}

          {showCreate && <CreateJobModal db={db} technicians={technicians} adminUser={user} onClose={()=>setShowCreate(false)} />}
          {showUsers && <UsersModal db={db} onClose={()=>setShowUsers(false)} />}
          {showNotifications && <NotificationsModal notifications={notifications} onClose={()=>setShowNotifications(false)} onRequestPermission={requestNotifPermission} />}
        </div>
      );
    };

    // ─── App ────────────────────────────────────────────
    const App = () => {
      const [db, setDb] = useState(null);
      const [user, setUser] = useState(null);
      const [init, setInit] = useState(false);

      useEffect(() => {
        try {
          let cfg;
          try { cfg = JSON.parse(localStorage.getItem('firebaseConfig')); } catch {}
          cfg = cfg || DEFAULT_FIREBASE_CONFIG;
          localStorage.setItem('firebaseConfig', JSON.stringify(cfg));
          if (!firebase.apps.length) firebase.initializeApp(cfg);
          setDb(firebase.firestore());
          registerServiceWorker();
          showToast('Bağlandı', 'Firebase bağlantısı kuruldu', 'success');
        } catch(e) {
          showToast('Bağlantı Hatası', e?.message||e, 'error');
        } finally {
          setInit(true);
        }
      }, []);

      if (!init || !db) return (
        <div className="login-wrap">
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:40,marginBottom:12}}>⏳</div>
            <div style={{fontSize:18,fontWeight:700,color:'var(--text-muted)'}}>Bağlanıyor…</div>
          </div>
        </div>
      );

      if (!user) return <Login db={db} onLogin={setUser} />;
      return <Dashboard user={user} db={db} onLogout={()=>setUser(null)} />;
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
